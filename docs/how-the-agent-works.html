<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research run walkthrough</title>
<meta name="description" content="Step-by-step replay of one deep_research_agent run: who calls whom, what streams to the client, and which guardrail fires where.">
<style>
  /* Tokens. Light by default, dark follows the OS (or data-theme). Each lane
     colour is an actor in the run; the same colour marks its spans, arrows and
     events everywhere on the page. */
  :root {
    --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa;
    --ink: #18202b; --muted: #556072; --faint: #8b94a3; --line: #d9dfe7;
    --client: #687385; --orch: #b0721a; --fleet: #2e63c8; --worker: #7a4ec2;
    --tools: #1c8193; --sandbox: #2a8656; --guard: #c4412d; --ok: #2a8656;
    --cursor: #18202b0d;
    --sans: "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    --lane-h: 48px; --label-w: 212px; --phase-h: 30px; --axis-h: 22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1319; --surface: #161b23; --surface-2: #1c222c;
      --ink: #e5e9ef; --muted: #9ba5b4; --faint: #677284; --line: #2a323e;
      --client: #9aa5b4; --orch: #e2a649; --fleet: #7ca3f3; --worker: #b38ff0;
      --tools: #55c3d4; --sandbox: #5cc690; --guard: #f07d6b; --ok: #5cc690;
      --cursor: #ffffff0c; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1319; --surface: #161b23; --surface-2: #1c222c;
    --ink: #e5e9ef; --muted: #9ba5b4; --faint: #677284; --line: #2a323e;
    --client: #9aa5b4; --orch: #e2a649; --fleet: #7ca3f3; --worker: #b38ff0;
    --tools: #55c3d4; --sandbox: #5cc690; --guard: #f07d6b; --ok: #5cc690;
    --cursor: #ffffff0c; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
  code { font: 12px var(--mono); background: var(--surface-2); border: 1px solid var(--line);
         border-radius: 4px; padding: 0 4px; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--fleet); outline-offset: 2px; }

  .page { max-width: 1680px; margin: 0 auto; padding: 18px 20px 20px; display: grid;
          grid-template-rows: auto auto auto minmax(300px, 1fr); grid-template-columns: minmax(0, 1fr);
          gap: 14px; height: 100vh; }

  /* ---------- header */
  .top { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .top p { margin: 3px 0 0; color: var(--muted); max-width: 72ch; font-size: 13.5px; }
  .top a { color: inherit; }
  .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls label { color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .btn, .controls select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 11px; cursor: pointer; font-size: 13px; line-height: 1.3;
  }
  .btn:hover, .controls select:hover { border-color: var(--muted); }
  .btn.primary { min-width: 72px; font-weight: 600; }
  #count { font: 12px var(--mono); color: var(--muted); min-width: 58px; text-align: right;
           font-variant-numeric: tabular-nums; }

  /* ---------- trace (swimlanes) */
  /* min-height: the page grid must never squeeze the timeline (overflow-x would let it clip lanes) */
  .trace { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
           overflow-x: auto; overflow-y: hidden; min-height: min-content; }
  .trace-inner { position: relative; min-width: 920px; }
  .grid { display: grid; position: relative;
          grid-template-columns: var(--label-w) repeat(var(--n), minmax(38px, 1fr));
          grid-template-rows: var(--phase-h) repeat(var(--lanes), var(--lane-h)) var(--axis-h); }
  .phase { grid-row: 1; display: flex; align-items: center; justify-content: center;
           font-size: 12px; color: var(--faint); border-bottom: 1px solid var(--line);
           border-left: 1px solid var(--line); cursor: pointer; background: none; border-top: 0;
           border-right: 0; padding: 0 4px; white-space: nowrap; overflow: hidden; }
  .phase:hover { color: var(--ink); }
  .phase[data-state="past"] { color: var(--muted); }
  .phase[data-state="now"] { color: var(--ink); font-weight: 650; box-shadow: inset 0 -2px 0 var(--ink); }
  .lane-label { grid-column: 1; display: flex; flex-direction: column; justify-content: center;
                padding: 0 12px 0 14px; border-bottom: 1px solid var(--line); min-width: 0;
                border-left: 3px solid var(--c); }
  .lane-label b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane-label span { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden;
                     text-overflow: ellipsis; }
  .cell { border-bottom: 1px solid var(--line); border-left: 1px dashed var(--line); }
  .col-hit { grid-row: 2 / -1; cursor: pointer; z-index: 1; }
  .col-hit[data-now="1"] { background: var(--cursor); }
  .col-hit[data-future="1"] { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--cursor) 6px 7px); }
  .axis { grid-row: -2; font: 10.5px var(--mono); color: var(--faint); display: flex;
          align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .axis[data-now="1"] { color: var(--ink); font-weight: 700; }

  .span { position: relative; z-index: 2; align-self: center; height: 26px; margin: 0 3px;
          border-radius: 5px; background: color-mix(in srgb, var(--c) 16%, var(--surface));
          border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
          border-left: 3px solid var(--c); font-size: 11.5px; padding: 0 7px; display: flex;
          align-items: center; min-width: 0; pointer-events: none; }
  /* The bar holds an invisible copy of its label (it sizes the bar); the visible label
     is a separate layer ABOVE the current step's arrows, on the bar's own fill, so an
     arrow crossing a bar shows on its body and only breaks where it passes the text. */
  .span > span { white-space: nowrap; visibility: hidden; }
  .span-label { position: relative; z-index: 4; align-self: center; justify-self: start;
                margin-left: 11px; padding: 0 2px; height: 16px; line-height: 16px; border-radius: 3px;
                font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                max-width: calc(100% - 22px); pointer-events: none;
                background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
  .span-label[data-edge="1"] { max-width: none; }
  .span-label.enter { animation: fade .25s .45s both; }
  @keyframes fade { from { opacity: 0; } }
  .span[data-open="1"] { border-right-style: dashed; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  /* A bar that reaches the current step has nothing but empty future columns to its
     right, so it stretches to fit its label instead of cutting it to "ReAct l…". */
  .span[data-edge="1"] { justify-self: start; width: max-content; min-width: calc(100% - 6px); }
  .span.enter { animation: grow .5s ease-out; transform-origin: left; }
  @keyframes grow { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  .mark { position: relative; z-index: 4; align-self: start; justify-self: end; margin: 3px 3px 0 0;
          font: 600 10px var(--mono); padding: 0 5px; border-radius: 4px; color: var(--surface);
          background: var(--tone); white-space: nowrap; pointer-events: none; line-height: 15px;
          border: 1px solid var(--tone); }
  /* gate outcomes are filled; a failed script is not a gate, so it is only outlined */
  .mark[data-tone="ok"] { --tone: var(--ok); }
  .mark[data-tone="bounce"] { --tone: var(--guard); }
  .mark[data-tone="error"] { --tone: var(--guard); background: var(--surface); color: var(--guard); border-style: dashed; }
  .mark.enter { animation: pop .4s ease-out; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }

  /* past arrows under the bars (z 1); current arrows + pills over them (z 3), under bar labels (z 4) */
  svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
  svg.arrows.past { z-index: 1; }
  svg.arrows path { fill: none; stroke-width: 1.6; }
  svg.arrows path.old { opacity: .45; }
  svg.arrows .pill { fill: var(--surface); stroke-width: 1; }
  svg.arrows .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .7s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  svg.arrows text { font: 600 10.5px var(--mono); }

  /* ---------- details */
  .details { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr);
             gap: 14px; min-height: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
           display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel h3 { margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--muted);
              border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .panel h3 small { font-weight: 400; color: var(--faint); }
  .panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; }

  .story .where { font-size: 12.5px; color: var(--muted); }
  .story h2 { margin: 2px 0 8px; font-size: 19px; line-height: 1.3; font-weight: 650; letter-spacing: -.005em; }
  .story p { margin: 0 0 10px; max-width: 68ch; }
  .story .enter { animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
  .guards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .guard { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
           background: var(--surface-2); }
  .guard em { font: 11px var(--mono); font-style: normal; color: var(--muted); margin-left: 4px; }
  .guard[data-tone="bounce"] { border-color: var(--guard); }
  .guard[data-tone="bounce"] b { color: var(--guard); }
  .guards-title { font-size: 12px; color: var(--muted); margin: 12px 0 0; }

  .events { font: 11.5px/1.55 var(--mono); padding: 6px 0; }
  .ev { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 8px; padding: 2px 14px; opacity: .5; }
  .ev[data-now="1"] { opacity: 1; background: var(--cursor); }
  .ev[data-now="1"].enter { animation: rise .35s ease-out; }
  .ev .t { font-weight: 700; color: var(--c, var(--muted)); }
  .ev .p { color: var(--muted); overflow-wrap: anywhere; }
  .ev-sep { font: 10.5px var(--sans); color: var(--faint); padding: 6px 14px 0; }
  .empty { color: var(--faint); font: 13px var(--sans); padding: 8px 14px; }

  /* the client preview: what a frontend built on the events would render */
  .chat { display: flex; flex-direction: column; gap: 9px; font-size: 13px; }
  .chat .enter { animation: rise .35s ease-out; }
  .bubble { align-self: flex-end; max-width: 88%; background: color-mix(in srgb, var(--fleet) 14%, var(--surface));
            border-radius: 12px 12px 3px 12px; padding: 7px 11px; }
  .thinking { color: var(--muted); font-style: italic; border-left: 2px solid var(--line); padding-left: 9px; }
  .card { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--surface-2); }
  .card .h { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .todo { display: flex; gap: 7px; align-items: baseline; }
  .todo i { font-style: normal; font: 11px var(--mono); color: var(--faint); width: 12px; }
  .todo[data-done="1"] { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .todo[data-done="1"] i { color: var(--ok); }
  .spark { width: 100%; height: 46px; display: block; }
  .script { font: 11.5px var(--mono); display: flex; flex-direction: column; gap: 2px; }
  .script b { font-weight: 600; }
  .script .out { color: var(--muted); }
  .finding { border-left: 3px solid var(--fleet); }
  .cite { font: 600 10.5px var(--mono); color: var(--fleet); }
  .report { border-left: 3px solid var(--orch); background: var(--surface); }
  .report h4 { margin: 0 0 4px; font-size: 14px; }
  .report p { margin: 4px 0; }
  .report .src { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 5px; font: 11px var(--mono); color: var(--muted); }
  .endline { text-align: center; font: 11px var(--mono); color: var(--faint); }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 0 2px; }
  .legend .lane-key::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
                              background: var(--c); margin-right: 6px; vertical-align: -1px; }
  .legend .marks { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend .mark { display: inline-block; margin: 0 5px 0 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 1100px) {
    .details { grid-template-columns: 1fr 1fr; }
    .story { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .page { padding: 14px 16px 20px; height: auto; grid-template-rows: auto; }
    .details { grid-template-columns: 1fr; }
    .panel { max-height: 420px; }
    .controls { margin-left: 0; }
    :root { --label-w: 150px; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <div>
      <h1>How one research run works</h1>
      <p>A replay of a single <code>deep_research_agent</code> run: who calls whom, what streams to the client,
        and where each guardrail fires. Companion to <a href="HOW_THE_AGENT_WORKS.md">HOW_THE_AGENT_WORKS.md</a>.</p>
    </div>
    <div class="controls">
      <label>Model tier <select id="tier" title="Model tier (MODEL_TIERS in config.py)"></select></label>
      <button class="btn" id="prev" title="Previous step (←)" aria-label="Previous step">←</button>
      <button class="btn primary" id="play" title="Play / pause (space)">Play</button>
      <button class="btn" id="next" title="Next step (→)" aria-label="Next step">→</button>
      <select id="speed" title="Playback speed" aria-label="Playback speed">
        <option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option>
      </select>
      <span id="count" aria-live="polite"></span>
    </div>
  </header>

  <section class="trace" aria-label="Run timeline: one column per step, one lane per actor">
    <div class="trace-inner">
      <div class="grid" id="grid"></div>
      <svg class="arrows past" id="arrowsPast" aria-hidden="true"></svg>
      <svg class="arrows" id="arrows" aria-hidden="true"></svg>
    </div>
  </section>

  <div class="legend" id="legend"></div>

  <section class="details">
    <article class="panel story" aria-live="polite">
      <h3>What happens <small id="phaseName"></small></h3>
      <div class="panel-body" id="story"></div>
    </article>
    <article class="panel">
      <h3>Custom event stream <small>events.py · EVENT_SCHEMAS</small></h3>
      <div class="panel-body events" id="events"></div>
    </article>
    <article class="panel">
      <h3>What the user sees <small>rendered from the stream</small></h3>
      <div class="panel-body chat" id="chat"></div>
    </article>
  </section>
</div>

     tests/test_model_tiering.py fails when the two drift. -->

  },

    "utility_model": "deepseek/deepseek-v4-flash-0731",

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const TIERS = JSON.parse($("#model-tiers").textContent);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ------------------------------------------------------------------ actors */
const LANES = [
  { id: "client",  c: "client",  name: "Client app",         sub: "SSE · custom + messages" },
  { id: "orch",    c: "orch",    name: "Orchestrator",       sub: "{research}" },
  { id: "subA",    c: "fleet",   name: "Sub-agent A: market",   sub: "{subagent}" },
  { id: "subB",    c: "fleet",   name: "Sub-agent B: on-chain", sub: "{subagent}" },
  { id: "subC",    c: "fleet",   name: "Sub-agent C: social",   sub: "{subagent}" },
  { id: "extract", c: "worker",  name: "Extract worker",        sub: "{utility}" },
  { id: "coder",   c: "worker",  name: "Coding worker",         sub: "{coding}" },
  { id: "tools",   c: "tools",   name: "Data tools",         sub: "MCP · web · custom · skills" },
  { id: "sandbox", c: "sandbox", name: "llm-sandbox",        sub: "one session per run" },
];
const LANE_INDEX = Object.fromEntries(LANES.map((l, i) => [l.id, i]));
const LANE_COLOR = Object.fromEntries(LANES.map((l) => [l.id, `var(--${l.c})`]));
const EVENT_COLOR = {
  run_start: "client", status: "client", usage: "client", report: "orch",
  mcp_call: "tools", mcp_result: "tools", tool_call: "tools", tool_result: "tools",
  search_query: "tools", search_results: "tools", source: "tools", skill: "tools",
  chart: "tools", script: "worker", subagent_findings: "fleet", clarification: "guard",
};
const PHASES = { send: "Send", build: "Build", triage: "Triage", plan: "Plan",
                 gather: "Gather", synth: "Synthesize", deliver: "Deliver" };

/* ------------------------------------------------------------------ the run
   One entry per column. Spans open with `open` and stay open until `close`
   names them (or the run ends); `once` spans live for this column only.
   `{research}`-style placeholders resolve against the selected tier. */
const STEPS = [
{ phase: "send", title: "The question goes out",
  text: `The client starts a run with <code>POST /threads/{id}/runs/stream</code> and keeps the SSE response open. It renders two channels: typed events on <code>custom</code> (the middle column) and the orchestrator's narration tokens on <code>messages</code>.`,
  open: [["client", "cl", "SSE stream open"]],
  arrows: [["client", "orch", "runs/stream"]],
  chat: (c) => c.push({ k: "bubble", text: "Analyze Bitcoin's last 30 days — price, on-chain and social." }) },

{ phase: "build", title: "make_graph builds this run",
  text: `LangGraph calls the async factory <code>make_graph(config)</code> once per run, so keys, model tier, MCP servers, sandbox and skills come from the request, not from globals. The <b>{tier}</b> tier fills five model slots; provider routing picks OpenRouter endpoints per model by price and throughput, and if those preferences ever leave no endpoint, the call retries with fewer of them instead of failing. MCP tools load per server, and three sub-agent specs are registered. The sandbox session is not opened yet — that happens on first use.`,
  once: [["orch", "build"]],
  guards: [["UsageMeter", "before_agent", "emits run_start"]],
  events: [["run_start", "{protocol_version: 1, engine_version: \"0.1.0\", started_at}"],
           ["status", "{state: \"mcp_ready\", tool_count, tools: [\"fetch_metric_data\", …]}"]] },

{ phase: "triage", title: "A 250-token call decides if this is research",
  text: `Before the full harness runs (about 12k tokens of prompt and tool schemas), TriageRouterMiddleware asks <code>{research}</code> one question: SIMPLE or RESEARCH? A greeting or a definition is answered right here and the turn ends. Anything involving data, current figures or analysis — and any calculation at all — falls through.`,
  once: [["orch", "triage"]],
  guards: [["TriageRouter", "before_model", "verdict: RESEARCH"]],
  events: [["status", "{state: \"triage\", detail: \"research\"}"]] },

{ phase: "plan", title: "The orchestrator plans",
  text: `Now the real loop starts. Its prompt triages again — COMPUTE runs <code>execute</code> and replies with the number, AMBIGUOUS calls <code>request_clarification</code> — then lays out the angles with <code>write_todos</code>. The narration between steps streams on <code>messages</code>; the todo list arrives with the state updates. Before every model call BudgetMiddleware checks tool calls, tokens and wall-clock against the run ceilings: a wrap-up nudge at 75%, a hard stop at 100%.`,
  open: [["orch", "loop", "ReAct loop · plan → delegate → synthesize"]],
  guards: [["Budget", "before_model", "200 calls · 4M tokens · 45 min"], ["LoopGuard", "after_model", "repeats"],
           ["PromptCache", "wrap_model_call", "OpenRouter"]],
  events: [["status", "{state: \"model_call\", role: \"orchestrator\", model: \"{research}\", step: 1}"]],
  chat: (c) => {
    c.push({ k: "thinking", text: "This needs live price, on-chain and social data — research, not a quick answer." });
    c.push({ k: "todos", items: ["Market action", "On-chain activity", "Social & sentiment", "Write the report"], done: [] });

/* ------------------------------------------------------------------ state */
let tier = "mid", step = 0, playing = false, timer = null, speed = 1, lastRendered = -1;

function fill(s) {
  const t = TIERS[tier] || {};
  const short = (m) => (m || "").split("/").pop();
  return s.replace(/\{tier\}/g, tier)
          .replace(/\{(research|subagent|utility|compaction|coding)\}/g, (_, k) => short(t[k + "_model"]));
}

/* Replays steps 0..upto into spans, marks and chat — every render is derived
   from scratch, so stepping backwards can never leave stale state behind. */
function derive(upto) {
  const spans = [], openById = {}, marks = [], chat = [], events = [];
  chat.todo = (i) => { const t = chat.find((x) => x.k === "todos"); if (t) t.done.push(i); };
  STEPS.slice(0, upto + 1).forEach((s, i) => {
    (s.open || []).forEach(([lane, id, label]) => {
      const sp = { lane, label, from: i, to: null };
      spans.push(sp); openById[id] = sp;
    });
    (s.once || []).forEach(([lane, label]) => spans.push({ lane, label, from: i, to: i }));
    (s.close || []).forEach((id) => { if (openById[id]) openById[id].to = i; });
    (s.marks || []).forEach(([lane, label, tone]) => marks.push({ lane, label, tone, at: i }));
    (s.events || []).forEach(([t, p]) => events.push({ t, p, at: i }));
    if (s.chat) s.chat(chat);
  });
  return { spans, marks, chat, events };
}

/* ------------------------------------------------------------------ timeline */
const grid = $("#grid"), svg = $("#arrows"), svgPast = $("#arrowsPast");
grid.style.setProperty("--n", STEPS.length);
grid.style.setProperty("--lanes", LANES.length);

function place(node, col, row, colEnd) {
  node.style.gridColumn = colEnd ? `${col} / ${colEnd}` : `${col}`;
  node.style.gridRow = `${row}`;
  return node;
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function renderGrid(animate) {
  const d = derive(step);
  grid.innerHTML = "";
  // phase band: consecutive steps sharing a phase merge into one header cell
  let i = 0;
  while (i < STEPS.length) {
    let j = i;
    while (j + 1 < STEPS.length && STEPS[j + 1].phase === STEPS[i].phase) j++;
    const b = place(el("button", "phase", PHASES[STEPS[i].phase]), i + 2, 1, j + 3);
    b.dataset.state = step >= i && step <= j ? "now" : step > j ? "past" : "";
    const target = i;
    b.addEventListener("click", () => go(target, false));
    grid.appendChild(b);
    i = j + 1;
  }
  LANES.forEach((l, r) => {
    const lab = place(el("div", "lane-label", `<b>${esc(l.name)}</b><span>${esc(fill(l.sub))}</span>`), 1, r + 2);
    lab.style.setProperty("--c", `var(--${l.c})`);
    lab.title = `${l.name} — ${fill(l.sub)}`;
    grid.appendChild(lab);
    for (let k = 0; k < STEPS.length; k++) grid.appendChild(place(el("div", "cell"), k + 2, r + 2));
  });
  for (let k = 0; k < STEPS.length; k++) {
    const hit = place(el("div", "col-hit"), k + 2, 2);
    hit.style.gridRow = `2 / ${LANES.length + 2}`;
    hit.dataset.now = k === step ? "1" : "0";
    hit.dataset.future = k > step ? "1" : "0";
    hit.title = `Step ${k + 1}: ${STEPS[k].title}`;
    hit.addEventListener("click", () => go(k, false));
    grid.appendChild(hit);
    const ax = place(el("div", "axis", String(k + 1)), k + 2, LANES.length + 2);
    ax.dataset.now = k === step ? "1" : "0";
    grid.appendChild(ax);
  }
  d.spans.forEach((s) => {
    const to = s.to == null ? step : s.to;
    const lane = LANES[LANE_INDEX[s.lane]];
    const sp = place(el("div", "span", `<span>${esc(fill(s.label))}</span>`), s.from + 2, LANE_INDEX[s.lane] + 2, to + 3);
    sp.style.setProperty("--c", `var(--${lane.c})`);
    sp.dataset.open = s.to == null && step < STEPS.length - 1 ? "1" : "0";
    sp.dataset.edge = to === step ? "1" : "0";
    const lb = place(el("div", "span-label", esc(fill(s.label))), s.from + 2, LANE_INDEX[s.lane] + 2, to + 3);
    lb.style.setProperty("--c", `var(--${lane.c})`);
    lb.dataset.edge = sp.dataset.edge;
    if (animate && s.from === step) { sp.classList.add("enter"); lb.classList.add("enter"); }
    grid.append(sp, lb);
  });
  d.marks.forEach((m) => {
    const mk = place(el("div", "mark", esc(m.label)), m.at + 2, LANE_INDEX[m.lane] + 2);
    mk.dataset.tone = m.tone;
    if (animate && m.at === step) mk.classList.add("enter");
    grid.appendChild(mk);
  });
  drawArrows(animate, d.spans);
}

/* Connectors. A call that CREATES a bar in this step is drawn Gantt-style: down a
   trunk just left of the new bar (where that lane is still empty), then right into the
   bar's left edge — a fan-out shares one trunk. A call into a bar that already runs is a
   straight vertical line in the step's column. A call and its return in the same step
   are one connector with a head at each end. The current step draws over the bars (bar
   labels sit one layer higher); past steps fade behind them. Labels are pills in the
   gaps between lanes. */
const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  return e;
}
function connectors(arrows) {
  const out = [], used = new Set();
  arrows.forEach(([from, to, label], k) => {
    if (used.has(k)) return;
    const back = arrows.findIndex(([f, t], j) => j !== k && !used.has(j) && f === to && t === from);
    if (back >= 0) used.add(back);
    used.add(k);
    out.push({ from, to, label: label || (back >= 0 ? arrows[back][2] : ""), both: back >= 0 });
  });
  return out;
}
function drawArrows(animate, spans = derive(step).spans) {
  svg.innerHTML = ""; svgPast.innerHTML = "";
  const g = grid.getBoundingClientRect();
  const css = getComputedStyle(grid);
  const labelW = parseFloat(css.getPropertyValue("--label-w")) || 212;
  const laneH = parseFloat(css.getPropertyValue("--lane-h")) || 48;
  const phaseH = parseFloat(css.getPropertyValue("--phase-h")) || 30;
  const barHalf = 13, margin = 3;  // .span: height 26px, margin 0 3px
  const colW = (g.width - labelW) / STEPS.length;
  const colLeft = (i) => labelW + colW * i;
  const center = (lane) => phaseH + LANE_INDEX[lane] * laneH + laneH / 2;
  const startsAt = (lane, i) => spans.some((s) => s.lane === lane && s.from === i);
  const runsInto = (lane, i) => spans.some((s) => s.lane === lane && s.from < i && (s.to == null ? step : s.to) >= i);
  const defs = svgEl("defs", {});
  svgPast.appendChild(defs);
  LANES.forEach((l) => defs.insertAdjacentHTML("beforeend",
    `<marker id="head-${l.id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">` +
    `<path d="M0 0 L8 4 L0 8 z" fill="${LANE_COLOR[l.id]}"/></marker>`));

  STEPS.slice(0, step + 1).forEach((s, i) => {
    const conns = connectors(s.arrows || []);
    const straight = conns.filter((c) => !(startsAt(c.to, i) && runsInto(c.from, i)));
    const trunks = [...new Set(conns.filter((c) => !straight.includes(c)).map((c) => c.from))];
    const pills = [];
    conns.forEach((c) => {
      const ya = center(c.from), yb = center(c.to), dir = yb > ya ? 1 : -1;
      const y1 = ya + dir * barHalf;
      let d, x;
      if (straight.includes(c)) {
        x = colLeft(i) + colW * (straight.indexOf(c) + 1) / (straight.length + 1);
        d = `M ${x} ${y1 + (c.both ? dir : 0)} V ${yb - dir * (barHalf + 1)}`;
      } else {
        x = colLeft(i) - 12 - 5 * trunks.indexOf(c.from);  // room for a visible head on the branch
        d = `M ${x} ${y1 + (c.both ? dir : 0)} V ${yb} H ${colLeft(i) + margin - 1}`;
      }
      const p = svgEl("path", { d, stroke: LANE_COLOR[c.from], "marker-end": `url(#head-${c.from})` });
      if (c.both) p.setAttribute("marker-start", `url(#head-${c.from})`);
      if (i < step) p.classList.add("old");
      (i < step ? svgPast : svg).appendChild(p);
      if (i === step && animate && !reduced) {
        p.style.setProperty("--len", p.getTotalLength());
        p.classList.add("draw");
      }
      if (i === step && c.label) pills.push({ ...c, x });
    });
    if (i !== step) return;
    // One pill per distinct label ("task ×3"), in the first free lane gap along its line.
    const usedGaps = new Set(), byLabel = new Map();
    pills.forEach((c) => byLabel.has(c.label) ? byLabel.get(c.label).n++ : byLabel.set(c.label, { ...c, n: 1 }));
    byLabel.forEach((c) => {
      const a = LANE_INDEX[c.from], b = LANE_INDEX[c.to];
      const gaps = a < b ? Array.from({ length: b - a }, (_, j) => a + 1 + j)
                         : Array.from({ length: a - b }, (_, j) => a - j);
      const gap = gaps.find((x) => !usedGaps.has(x)) ?? gaps[0];
      usedGaps.add(gap);
      const flip = c.x > g.width - 150;  // near the right edge: put the pill left of the line
      const text = svgEl("text", { x: c.x + (flip ? -8 : 8), y: phaseH + gap * laneH, fill: LANE_COLOR[c.from],
                                   "text-anchor": flip ? "end" : "start", "dominant-baseline": "central" });
      text.textContent = c.n > 1 ? `${c.label} ×${c.n}` : c.label;
      svg.appendChild(text);
      const bb = text.getBBox();
      svg.insertBefore(svgEl("rect", { x: bb.x - 5, y: bb.y - 2, width: bb.width + 10, height: bb.height + 4,
                                       rx: 4, stroke: LANE_COLOR[c.from], class: "pill" }), text);
    });
  });
}

/* ------------------------------------------------------------------ panels */
function renderStory(animate) {
  const s = STEPS[step];
  $("#phaseName").textContent = `${PHASES[s.phase]} · step ${step + 1} of ${STEPS.length}`;
  const guards = (s.guards || []).map(([name, hook, note, tone]) =>
    `<span class="guard" data-tone="${tone || ""}"><b>${esc(name)}</b><em>${esc(hook)}</em>` +
    `${note ? ` — ${esc(fill(note))}` : ""}</span>`).join("");
  $("#story").innerHTML =
    `<div class="${animate ? "enter" : ""}"><h2>${esc(s.title)}</h2><p>${fill(s.text)}</p>` +
    (guards ? `<p class="guards-title">Middleware involved</p><div class="guards">${guards}</div>` : "") + `</div>`;
}

function renderEvents(animate) {
  const { events } = derive(step);
  const box = $("#events");
  if (!events.length) { box.innerHTML = `<div class="empty">No custom events yet — the stream opens when the run builds.</div>`; return; }
  let html = "", last = -1;
  events.forEach((e) => {
    if (e.at !== last) { html += `<div class="ev-sep">step ${e.at + 1} · ${esc(STEPS[e.at].title)}</div>`; last = e.at; }
    const now = e.at === step;
    html += `<div class="ev${now && animate ? " enter" : ""}" data-now="${now ? 1 : 0}" style="--c: var(--${EVENT_COLOR[e.t] || "muted"})">` +
            `<span class="t">${esc(e.t)}</span><span class="p" title="${esc(fill(e.p))}">${esc(fill(e.p))}</span></div>`;
  });
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

const SPARK = [109.2, 108.4, 110.1, 109.6, 111.2, 110.4, 108.9, 104.1, 103.2, 104.8, 103.9, 102.7,
               103.5, 102.2, 101.4, 102.9, 101.8, 100.6, 101.2, 99.8, 100.9, 101.6, 100.2, 99.4,
               100.8, 101.1, 99.9, 100.4, 99.6, 100.0];
function sparkline() {
  const w = 300, h = 46, lo = Math.min(...SPARK), hi = Math.max(...SPARK);
  const pts = SPARK.map((v, i) => `${(i / (SPARK.length - 1) * w).toFixed(1)},${(h - 4 - (v - lo) / (hi - lo) * (h - 8)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Bitcoin price, falling from 109k to 100k over 30 days">` +
         `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--tools)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function chartCard() {
  return `<div class="card"><div class="h"><span>Price USD — bitcoin</span><span>Santiment</span></div>${sparkline()}</div>`;
}
function renderChat(animate) {
  const { chat } = derive(step);
  const prev = derive(Math.max(0, step - 1)).chat.length;
  const html = chat.map((it, i) => {
    const cls = animate && step > 0 && i >= prev ? " enter" : "";
    switch (it.k) {
      case "bubble": return `<div class="bubble${cls}">${esc(it.text)}</div>`;
      case "thinking": return `<div class="thinking${cls}">${esc(it.text)}</div>`;
      case "todos": return `<div class="card${cls}"><div class="h"><span>Plan</span></div>` +
        it.items.map((t, j) => `<div class="todo" data-done="${it.done.includes(j) ? 1 : 0}"><i>${it.done.includes(j) ? "✓" : "○"}</i>${esc(t)}</div>`).join("") + `</div>`;
      case "script": return `<div class="card script${cls}"><span>▸ <b>${esc(it.name)}</b> · ${esc(it.who)}</span><span class="out">${esc(it.out)}</span></div>`;
      case "search": return `<div class="card${cls}"><div class="h"><span>Searched the web</span><span>${it.n} results</span></div>${esc(it.q)}</div>`;
      case "finding": return `<div class="card finding${cls}"><div class="h"><span>${esc(it.unit)}</span><span>sourced</span></div>${esc(it.text)} <span class="cite">${esc(it.src)}</span></div>`;
      case "report": return `<div class="card report${cls}"><h4>Bitcoin, last 30 days</h4>` +
        `<p>Price fell 8.4% ($109.2k → $100.0k), the sharpest day on Aug 2 <span class="cite">[1]</span>.</p>` +
        chartCard() +
        `<p>Active addresses averaged 91.2k a day and cooled 11.8% into the final week <span class="cite">[2]</span>; ` +
        `the crowd turned net-short as social volume rose 64% <span class="cite">[3][4]</span>.</p>` +
        `<div class="src">Sources<br>[1][2][3] Santiment<br>[4] coindesk.com/markets/…</div></div>`;
      case "end": return `<div class="endline${cls}">${esc(it.text)}</div>`;
    }
    return "";
  }).join("");
  const box = $("#chat");
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

/* ------------------------------------------------------------------ transport */
function render() {
  const animate = !reduced && step === lastRendered + 1;
  renderGrid(animate);
  renderStory(animate);
  renderEvents(animate);
  renderChat(animate);
  $("#count").textContent = `${step + 1} / ${STEPS.length}`;
  lastRendered = step;
}
function go(i, keepPlaying) {
  step = Math.max(0, Math.min(STEPS.length - 1, i));
  if (!keepPlaying) setPlaying(false);
  render();
  schedule();
}
function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  if (step >= STEPS.length - 1) { setPlaying(false); return; }
  timer = setTimeout(() => go(step + 1, true), 6000 / speed);
}
function setPlaying(on) {
  playing = on;
  $("#play").textContent = on ? "Pause" : step >= STEPS.length - 1 ? "Replay" : "Play";
  if (!on) clearTimeout(timer);
}

$("#play").addEventListener("click", () => {
  if (playing) { setPlaying(false); return; }
  setPlaying(true);
  if (step >= STEPS.length - 1) { lastRendered = -1; go(0, true); } else schedule();
});
$("#next").addEventListener("click", () => go(step + 1, false));
$("#prev").addEventListener("click", () => go(step - 1, false));
$("#speed").addEventListener("change", (e) => { speed = parseFloat(e.target.value); schedule(); });
addEventListener("keydown", (e) => {
  if (e.target.closest("select")) return;
  if (e.key === "ArrowRight") go(step + 1, false);
  else if (e.key === "ArrowLeft") go(step - 1, false);
  else if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); $("#play").click(); }
  else if (e.key === "Home") go(0, false);
  else if (e.key === "End") go(STEPS.length - 1, false);
});
addEventListener("resize", () => drawArrows(false));

const tierSel = $("#tier");
Object.keys(TIERS).forEach((t) => tierSel.add(new Option(t, t, false, t === tier)));
tierSel.addEventListener("change", (e) => { tier = e.target.value; lastRendered = step; render(); });

const legend = [["orch", "orchestrator"], ["fleet", "research sub-agents"], ["worker", "extract / coding workers"],
                ["tools", "data tools"], ["sandbox", "sandbox"]];
const markKey = [["ok", "✓", "gate passed the handoff"], ["bounce", "↩", "gate sent it back once to fix"],
                 ["error", "✗", "script failed (not a gate)"]];
$("#legend").innerHTML =
  legend.map(([c, t]) => `<span class="lane-key" style="--c: var(--${c})">${t}</span>`).join("") +
  `<span class="marks">${markKey.map(([tone, sym, t]) => `<span><b class="mark" data-tone="${tone}">${sym}</b>${t}</span>`).join("")}</span>`;

render();
if (!reduced) { setPlaying(true); schedule(); }
</script>
