[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Portable, model-agnostic deep research agent (deepagents + LangGraph) with a typed streaming-event protocol and interleaved citations."
requires-python = ">=3.11"
# deepagents and langchain carry UPPER bounds: the engine reaches into their internals
# (middleware hooks, backends, the tool_call request field) and a mid-range bump has
# already silently no-op'd a gate once. Raising a cap is a deliberate, tested act.
dependencies = [
    "deepagents>=0.6.7,<0.7",
    "langchain>=1.0.0,<2",
    "langchain-openai>=0.3.0",
    "langchain-tavily>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["langgraph-cli[inmem]>=0.2.0", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Supply-chain freshness window: uv never resolves/installs a distribution
# published in the last 10 days, so a freshly-hijacked release can't reach us
# before the ecosystem notices. Relative durations need uv >= 0.12 (pinned in
# the Dockerfile; update your local uv to match).
exclude-newer = "10 days"
