name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # The lock must match pyproject (incl. the exclude-newer freshness window) —
      # a drifted lock fails here instead of resolving differently per machine.
      - run: uv lock --check
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -q
