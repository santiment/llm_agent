name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          # Keep in step with the Dockerfile pin; >=0.12 is required for the
          # relative exclude-newer window in pyproject.toml.
          version: "0.12.5"
          python-version: "3.11"
      # The lock must match pyproject (incl. the exclude-newer freshness window) —
      # a drifted lock fails here instead of resolving differently per machine.
      - run: uv lock --check
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -q
